name: Flutter Cross-Platform Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    # Nightly E2E tests at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch: # Manual trigger

env:
  FLUTTER_VERSION: '3.27.4'

jobs:
  # ============================================
  # UNIT & WIDGET TESTS (Fast - runs on every push)
  # ============================================
  # ============================================
  # QUALITY CHECK (Linting + Unit Tests)
  # ============================================
  quality-check:
    name: 🛡️ Quality Check (Lint & Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: 🔍 User Lint Check from Code
        run: flutter analyze

      - name: 🧪 Run Unit/Widget Tests
        run: flutter test --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  # ============================================
  # BUILD VERIFICATION (Does it compile?)
  # ============================================
  build-verify:
    name: 🏗️ Build Verification (Android)
    runs-on: ubuntu-latest
    needs: quality-check
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: 📱 Build Android APK (Debug)
        run: flutter build apk --debug


  # ============================================
  # ANDROID INTEGRATION TESTS (Emulator - Latest)
  # ============================================
  android-tests:
    name: Android E2E Tests (API 34)
    runs-on: ubuntu-latest
    needs: quality-check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android E2E tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            flutter test integration_test/ --timeout 600s

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results-api34
          path: |
            build/app/outputs/
            *.png

  # ============================================
  # ANDROID MINIMUM VERSION TEST (API 29)
  # ============================================
  android-min-version-tests:
    name: Android E2E Tests (API 29 - Minimum)
    runs-on: ubuntu-latest
    needs: quality-check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android E2E tests (API 29)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: Nexus 5X
          script: |
            flutter test integration_test/ --timeout 600s

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results-api29
          path: |
            build/app/outputs/
            *.png

  # ============================================
  # iOS INTEGRATION TESTS (Simulator)
  # ============================================
  ios-tests:
    name: iOS E2E Tests
    runs-on: macos-latest
    needs: quality-check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Start iOS Simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 15" | head -1 | grep -oE "[0-9A-F-]{36}")
          xcrun simctl boot "$UDID" || true
          echo "SIMULATOR_UDID=$UDID" >> $GITHUB_ENV

      - name: Run iOS E2E tests
        run: |
          flutter test integration_test/ -d $SIMULATOR_UDID --timeout 600s

      - name: Upload test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-results
          path: |
            build/ios/
            *.png

  # ============================================
  # macOS INTEGRATION TESTS
  # ============================================
  macos-tests:
    name: macOS E2E Tests
    runs-on: macos-latest
    needs: quality-check
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Run macOS tests
        run: flutter test integration_test/ -d macos --timeout 600s

  # ============================================
  # TEST SUMMARY
  # ============================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [quality-check, build-verify]
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Quality Check | ${{ needs.quality-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Verify | ${{ needs.build-verify.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "_Android (API 29 + 34), iOS, and macOS tests run on schedule/manual trigger._" >> $GITHUB_STEP_SUMMARY
